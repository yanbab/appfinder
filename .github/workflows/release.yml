name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package version with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Build macOS binaries (x64 and arm64)
        run: npm run build -- --publish never

      - name: Generate Changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          
          # 1. Try extracting release notes for this version from CHANGELOG.md
          CHANGELOG_NOTES=$(VERSION="$VERSION" node -e '
            const fs = require("fs");
            const version = process.env.VERSION || "";
            if (fs.existsSync("CHANGELOG.md")) {
              const content = fs.readFileSync("CHANGELOG.md", "utf8");
              const regex = new RegExp(`##\\s*\\[?v?${version.replace(/\\./g, "\\\\.")}\\]?[^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, "i");
              const match = content.match(regex);
              if (match && match[1].trim()) {
                console.log(match[1].replace(/---+\\s*$/, "").trim());
                process.exit(0);
              }
            }
          ' 2>/dev/null || echo "")

          OUTPUT=""
          if [ -n "$CHANGELOG_NOTES" ]; then
            OUTPUT="$CHANGELOG_NOTES"
          else
            # 2. Fallback to git tag message and commit log
            PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
            else
              COMMITS=$(git log -n 25 --pretty=format:"- %s (%h)" --no-merges)
            fi

            TAG_MSG=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^$/d')

            if [ -n "$TAG_MSG" ]; then
              OUTPUT="${TAG_MSG}"$'\n\n'
            fi
            if [ -n "$COMMITS" ]; then
              OUTPUT="${OUTPUT}### Commits"$'\n'"${COMMITS}"
            fi
          fi

          {
            echo "RELEASE_BODY<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/electron-builder/*.dmg
            dist/electron-builder/*.zip
            dist/*.dmg
          body: ${{ env.RELEASE_BODY }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap Cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::notice ::TAP_GITHUB_TOKEN secret not configured. Skipping Homebrew tap update."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          ARM_FILE=$(ls dist/electron-builder/*arm64*.dmg dist/*arm64*.dmg 2>/dev/null | head -n 1)
          INTEL_FILE=$(ls dist/electron-builder/*.dmg dist/*.dmg 2>/dev/null | grep -v arm64 | head -n 1)

          ARM_SHA=$(shasum -a 256 "$ARM_FILE" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "$INTEL_FILE" | awk '{print $1}')

          echo "Version: $VERSION"
          echo "ARM64 SHA: $ARM_SHA"
          echo "Intel SHA: $INTEL_SHA"

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/yanbab/homebrew-tap.git" tap-repo
          cd tap-repo
          mkdir -p Casks

          VERSION="$VERSION" ARM_SHA="$ARM_SHA" INTEL_SHA="$INTEL_SHA" node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const arm = process.env.ARM_SHA;
            const intel = process.env.INTEL_SHA;
            const lines = [
              `cask "appfinder" do`,
              `  arch arm: "arm64", intel: ""`,
              ``,
              `  version "${v}"`,
              `  sha256 arm:   "${arm}",`,
              `         intel: "${intel}"`,
              ``,
              `  url "https://github.com/yanbab/appfinder/releases/download/v#{version}/AppFinder-#{version}#{arch.empty? ? "" : "-#{arch}"}.dmg"`,
              `  name "AppFinder"`,
              `  desc "App store for the Homebrew package manager"`,
              `  homepage "https://github.com/yanbab/appfinder"`,
              ``,
              `  auto_updates true`,
              `  depends_on macos: :ventura`,
              ``,
              `  app "AppFinder.app"`,
              ``,
              `  postflight do`,
              `    system_command "xattr",`,
              `                   args: ["-cr", "#{appdir}/AppFinder.app"]`,
              `  end`,
              ``,
              `  zap trash: [`,
              `    "~/.config/appfinder",`,
              `    "~/Library/Application Support/AppFinder",`,
              `    "~/Library/Preferences/org.yanbab.appfinder.plist",`,
              `    "~/Library/Saved Application State/org.yanbab.appfinder.savedState",`,
              `  ]`,
              `end`,
              ``
            ];
            fs.writeFileSync("Casks/appfinder.rb", lines.join("\n"));
          '

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/appfinder.rb
          git commit -m "chore(cask): update appfinder to v${VERSION}" || echo "No changes to commit"
          git push origin main
