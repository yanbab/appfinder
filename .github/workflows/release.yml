name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build macOS binaries (x64 and arm64)
        run: npm run build -- --publish never

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap Cask
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::notice ::TAP_GITHUB_TOKEN secret not configured. Skipping Homebrew tap update."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          ARM_FILE=$(ls dist/*-arm64.dmg | head -n 1)
          INTEL_FILE=$(ls dist/*.dmg | grep -v arm64 | head -n 1)

          ARM_SHA=$(shasum -a 256 "$ARM_FILE" | awk '{print $1}')
          INTEL_SHA=$(shasum -a 256 "$INTEL_FILE" | awk '{print $1}')

          echo "Version: $VERSION"
          echo "ARM64 SHA: $ARM_SHA"
          echo "Intel SHA: $INTEL_SHA"

          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/yanbab/homebrew-tap.git" tap-repo
          cd tap-repo
          mkdir -p Casks

          cat << 'RUBY' | sed "s/__VERSION__/$VERSION/g" | sed "s/__ARM_SHA__/$ARM_SHA/g" | sed "s/__INTEL_SHA__/$INTEL_SHA/g" > Casks/appfinder.rb
cask "appfinder" do
  arch arm: "arm64", intel: ""

  version "__VERSION__"
  sha256 arm:   "__ARM_SHA__",
         intel: "__INTEL_SHA__"

  url "https://github.com/yanbab/appfinder/releases/download/v#{version}/AppFinder-#{version}#{arch.empty? ? "" : "-#{arch}"}.dmg"
  name "AppFinder"
  desc "App store for the Homebrew package manager"
  homepage "https://github.com/yanbab/appfinder"

  auto_updates true
  depends_on macos: ">= :ventura"

  app "AppFinder.app"

  zap trash: [
    "~/.config/appfinder",
    "~/Library/Application Support/AppFinder",
    "~/Library/Preferences/org.yanbab.appfinder.plist",
    "~/Library/Saved Application State/org.yanbab.appfinder.savedState",
  ]
end
RUBY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/appfinder.rb
          git commit -m "chore(cask): update appfinder to v${VERSION}" || echo "No changes to commit"
          git push origin main
