<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Settings</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d1d1f;
      --muted: #86868b;
      --border: #e5e5e7;
      --input-bg: #f5f5f7;
      --btn-active-bg: #ffffff;
      --btn-active-shadow: 0 1px 2px rgba(0,0,0,0.12);
      --seg-bg: #e5e5ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --text: #f5f5f7;
        --muted: #8e8e93;
        --border: #38383a;
        --input-bg: #2c2c2e;
        --btn-active-bg: #48484a;
        --btn-active-shadow: 0 1px 2px rgba(0,0,0,0.3);
        --seg-bg: #2c2c2e;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      font-size: 12px;
      line-height: 1.4;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-user-select: none;
      padding: 16px 18px;
      overflow: hidden;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .setting-row:last-child {
      margin-bottom: 0;
    }
    .setting-label {
      font-weight: 500;
    }
    .setting-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    select {
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      outline: none;
      cursor: default;
    }
    select:focus {
      border-color: #007aff;
    }
    .segmented-control {
      display: inline-flex;
      background-color: var(--seg-bg);
      border-radius: 6px;
      padding: 2px;
    }
    .segmented-btn {
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 3px 10px;
      border-radius: 4px;
      cursor: default;
      transition: all 0.15s ease;
    }
    .segmented-btn.active {
      background-color: var(--btn-active-bg);
      color: var(--text);
      box-shadow: var(--btn-active-shadow);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="setting-row">
    <div>
      <div class="setting-label" id="lbl-language">Language</div>
    </div>
    <div>
      <select id="select-language" aria-label="Language"></select>
    </div>
  </div>

  <div class="setting-row">
    <div>
      <div class="setting-label" id="lbl-statusbar">Always Show Status Bar</div>
      <div class="setting-desc" id="lbl-statusbar-desc">Keep the footer bar visible even when idle</div>
    </div>
    <div class="segmented-control" role="group" aria-label="Status Bar Toggle">
      <button type="button" class="segmented-btn" id="btn-statusbar-off">Off</button>
      <button type="button" class="segmented-btn" id="btn-statusbar-on">On</button>
    </div>
  </div>

  <script>
    let messages = {};
    let currentConfig = { alwaysShowStatusBar: false, language: 'system' };
    let availableLocales = [];
    let systemLocaleName = 'English';

    function __(key, ...args) {
      let text = (messages && messages[key] !== undefined) ? messages[key] : key;
      if (args.length > 0) {
        args.forEach(arg => {
          text = text.replace(/%s|%d/, String(arg));
        });
      }
      return text;
    }

    function updateTexts() {
      document.title = __('Settings');
      document.getElementById('lbl-language').textContent = __('Language');
      document.getElementById('lbl-statusbar').textContent = __('Always Show Status Bar');
      document.getElementById('lbl-statusbar-desc').textContent = __('Keep the footer bar visible even when idle');
      document.getElementById('btn-statusbar-off').textContent = __('Off');
      document.getElementById('btn-statusbar-on').textContent = __('On');

      const select = document.getElementById('select-language');
      const curVal = currentConfig.language || 'system';
      select.innerHTML = '';

      const sysOpt = document.createElement('option');
      sysOpt.value = 'system';
      sysOpt.textContent = __('System Default (%s)', systemLocaleName);
      select.appendChild(sysOpt);

      availableLocales.filter(l => l.code !== 'system').forEach(loc => {
        const opt = document.createElement('option');
        opt.value = loc.code;
        opt.textContent = loc.name;
        select.appendChild(opt);
      });

      select.value = curVal;
    }

    function updateStatusBarButtons(alwaysShow) {
      const btnOff = document.getElementById('btn-statusbar-off');
      const btnOn = document.getElementById('btn-statusbar-on');
      if (alwaysShow) {
        btnOn.classList.add('active');
        btnOff.classList.remove('active');
      } else {
        btnOff.classList.add('active');
        btnOn.classList.remove('active');
      }
    }

    async function init() {
      if (!window.ipc) return;

      try {
        const [cfg, msgs, locs, sysCode] = await Promise.all([
          window.ipc.getConfig?.() || {},
          window.ipc.getMessages?.() || {},
          window.ipc.getAvailableLocales?.() || [],
          window.ipc.getSystemLocale?.() || 'en',
        ]);

        currentConfig = cfg;
        messages = msgs;
        availableLocales = locs;

        const foundSys = locs.find(l => l.code === sysCode);
        if (foundSys && foundSys.name) {
          systemLocaleName = foundSys.name;
        }

        updateTexts();
        updateStatusBarButtons(Boolean(currentConfig.alwaysShowStatusBar));

        // Event listeners
        document.getElementById('select-language').addEventListener('change', async (e) => {
          const newLang = e.target.value;
          currentConfig.language = newLang;
          await window.ipc?.updateConfig?.({ language: newLang });
          messages = (await window.ipc?.getMessages?.()) || {};
          updateTexts();
        });

        document.getElementById('btn-statusbar-off').addEventListener('click', async () => {
          currentConfig.alwaysShowStatusBar = false;
          updateStatusBarButtons(false);
          await window.ipc?.updateConfig?.({ alwaysShowStatusBar: false });
        });

        document.getElementById('btn-statusbar-on').addEventListener('click', async () => {
          currentConfig.alwaysShowStatusBar = true;
          updateStatusBarButtons(true);
          await window.ipc?.updateConfig?.({ alwaysShowStatusBar: true });
        });

        window.ipc.on?.('i18n:changed', async () => {
          messages = (await window.ipc?.getMessages?.()) || {};
          updateTexts();
        });

        window.ipc.on?.('config:updated', (cfg) => {
          if (cfg) {
            currentConfig = cfg;
            if (typeof cfg.alwaysShowStatusBar === 'boolean') {
              updateStatusBarButtons(cfg.alwaysShowStatusBar);
            }
          }
        });
      } catch (err) {
        console.error('Failed to initialize settings:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
