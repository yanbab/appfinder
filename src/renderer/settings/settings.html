<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="settings.css">
  <script src="settings.js" defer></script>
  <script defer src="../../../node_modules/alpinejs/dist/cdn.min.js"></script>
</head>

<body class="settings-body no-transition" x-data="settings">
  <div class="settings-container">
    <div class="list-group">
      <!-- Always Show Status Bar -->
      <div class="list-row">
        <div class="settings-label-container">
          <span class="settings-label" x-text="__('Always Show Status Bar')">Always Show Status Bar</span>
        </div>
        <label class="switch">
          <input type="checkbox" x-model="alwaysShowStatusBar">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Show updates in Dock Badge -->
      <div class="list-row">
        <div class="settings-label-container">
          <span class="settings-label" x-text="__('Show updates count in dock badge')">Show updates count in dock badge</span>
        </div>
        <label class="switch">
          <input type="checkbox" x-model="showDockBadge">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Show updates in Menu Bar Tray -->
      <div class="list-row">
        <div class="settings-label-container">
          <span class="settings-label" x-text="__('Show updates count in menu bar')">Show updates count in menu bar</span>
        </div>
        <label class="switch">
          <input type="checkbox" x-model="showTrayIcon">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Automatically check for updates -->
      <div class="list-row">
        <div class="settings-label-container">
          <span class="settings-label" x-text="__('Automatically check for updates')">Automatically check for updates</span>
        </div>
        <label class="switch">
          <input type="checkbox" x-model="autoCheckUpdates">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Language -->
      <div class="list-row">
        <div class="settings-label-container">
          <span class="settings-label" x-text="__('Language')">Language</span>
        </div>
        <select id="language-select" x-model="language">
          <option value="system" x-text="getSystemDefaultLabel()">System</option>
          <hr>
          <template x-for="loc in locales" :key="loc.code">
            <option :value="loc.code" x-text="loc.name"></option>
          </template>
        </select>
      </div>

      <!-- Clear Caches -->
      <div class="list-row">
        <div class="settings-label-container">
          <span class="settings-label" x-text="__('Clear Caches')">Clear Caches</span>
          <span class="settings-desc" x-text="__('Run brew cleanup to remove cached downloads and lock files.')">Run
            brew cleanup to remove cached downloads and lock files.</span>
        </div>
        <button id="clear-caches-btn" class="btn btn-secondary"
          :disabled="isCleaning" @click="clearCaches()">
          <span x-text="isCleaning ? __('In Progress') : __('Clear')">Clear</span>
        </button>
      </div>
    </div>
  </div>
</body>

</html>
